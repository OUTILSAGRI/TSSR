<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes fichiers</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      color: #222;
      background: #fafafa;
    }

    h1 { margin-bottom: 8px; }
    p { color: #666; }

    button {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
      cursor: pointer;
    }

    button:hover { background: #f0f0f0; }

    .file {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 12px;
      margin: 8px 0;
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    .file-name {
      overflow-wrap: anywhere;
    }

    .actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .folders {
      margin: 25px 0;
      padding: 15px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    .folder {
      display: inline-block;
      margin: 5px;
    }

    #status {
      margin: 20px 0;
      color: #666;
    }
  </style>
</head>

<body>

  <h1>Mes fichiers</h1>
  <p>PDF et fichiers Word présents dans le projet GitHub, classés par dossier.</p>

  <div class="folders">
    <strong>Dossiers :</strong>
    <div id="folders"></div>
  </div>

  <div id="status">Chargement...</div>
  <div id="files"></div>

<script>
/*
  Le dépôt GitHub est détecté automatiquement depuis l'URL de la page.

  Exemple :
  https://moncompte.github.io/monprojet/
  devient :
  https://api.github.com/repos/moncompte/monprojet
*/

const path = window.location.pathname.split("/").filter(Boolean);
const owner = window.location.hostname.split(".")[0];
const repo = path[0];

const api = `https://api.github.com/repos/${owner}/${repo}`;

let files = [];
let folders = [];

async function load() {
  try {
    const response = await fetch(api + "/git/trees/main?recursive=1");

    if (!response.ok) {
      throw new Error("Impossible de lire le dépôt GitHub.");
    }

    const data = await response.json();

    // Tous les PDF et fichiers Word du dépôt, même s'ils sont dans des dossiers.
    files = data.tree.filter(item => {
      if (item.type !== "blob") return false;

      const name = item.path.toLowerCase();

      return (
        name.endsWith(".pdf") ||
        name.endsWith(".doc") ||
        name.endsWith(".docx")
      );
    });

    // Récupère tous les dossiers de la racine.
    folders = [...new Set(
      data.tree
        .filter(item => item.type === "tree")
        .map(item => item.path.split("/")[0])
    )];

    displayFolders();
    displayFiles();

    document.getElementById("status").textContent =
      files.length + " fichier(s) trouvé(s) dans le projet.";

  } catch (error) {
    document.getElementById("status").textContent = error.message;
  }
}

function displayFiles() {
  const container = document.getElementById("files");

  if (files.length === 0) {
    container.innerHTML = "<p>Aucun PDF ou fichier Word trouvé.</p>";
    return;
  }

  // Classe les fichiers par dossier racine.
  const groups = {};

  files.forEach(file => {
    const parts = file.path.split("/");
    const folder = parts.length > 1 ? parts[0] : "Racine";

    if (!groups[folder]) groups[folder] = [];
    groups[folder].push(file);
  });

  container.innerHTML = Object.keys(groups).sort().map(folder => `
    <div class="folders">
      <h2>📁 ${escapeHtml(folder)}</h2>
      ${groups[folder].map(file => `
        <div class="file">
          <span class="file-name">📄 ${escapeHtml(file.path)}</span>

          <div class="actions">
            <button onclick="openFile('${encodeURIComponent(file.path)}')">
              Ouvrir
            </button>

            <button onclick="moveFile('${encodeURIComponent(file.path)}')">
              Ranger
            </button>
          </div>
        </div>
      `).join("")}
    </div>
  `).join("");
}

function displayFolders() {
  const container = document.getElementById("folders");

  if (folders.length === 0) {
    container.innerHTML = "<span>Aucun dossier.</span>";
    return;
  }

  container.innerHTML = folders.map(folder => `
    <span class="folder">📁 ${escapeHtml(folder)}</span>
  `).join("");
}

function openFile(encodedName) {
  const name = decodeURIComponent(encodedName);

  const url =
    `https://github.com/${owner}/${repo}/blob/main/${encodeURIComponent(name)}`;

  window.open(url, "_blank");
}


async function moveFile(encodedName) {
  const name = decodeURIComponent(encodedName);

  if (folders.length === 0) {
    alert("Crée d'abord un dossier dans ton dépôt GitHub.");
    return;
  }

  const folder = prompt(
    "Dans quel dossier veux-tu ranger " + name + " ?\n\n" +
    folders.join("\n")
  );

  if (!folder || !folders.includes(folder)) {
    alert("Dossier invalide.");
    return;
  }

  alert(
    "Le déplacement réel d'un fichier dans GitHub nécessite une authentification " +
    "avec un token GitHub ayant les droits d'écriture."
  );
}

function escapeHtml(text) {
  return text.replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  }[char]));
}

load();
</script>

</body>
</html>
